# Despliegue en Render (https://render.com)
#
# NOTA DE DESEMPEÑO: el plan gratuito entrega 0,1 CPU y 512 MB de RAM. Esa
# limitación es una VENTAJA para este trabajo, no un estorbo: hace que el punto
# de saturación aparezca con una carga que podemos generar desde un notebook, y
# que los resultados sean reproducibles.
#
# Advertencia importante para las mediciones: el plan gratuito SUSPENDE el
# servicio tras 15 minutos sin tráfico, y reactivarlo toma cerca de un minuto.
# Antes de cualquier corrida de k6 hay que despertar el sitio y descartar las
# primeras peticiones, o el arranque en frío contaminará los percentiles.

services:
  - type: web
    name: pisada
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    # Ohio, para que coincida con la región de la base en Neon (us-east-2).
    #
    # No es un detalle: la latencia entre aplicación y base se paga en CADA
    # consulta, y la página de catálogo hace tres. Con la base en São Paulo y
    # la aplicación en Oregon, una sola página sumaría cerca de 600 ms solo en
    # viajes de red, y las mediciones reflejarían la red y no el sistema.
    region: ohio
    healthCheckPath: /
    envVars:
      # La cadena de conexión se pega a mano en el panel de Render.
      # NUNCA se escribe en este archivo: va al repositorio.
      - key: DATABASE_URL
        sync: false
      # Identificador de medición de GA4. También se incrusta en el bundle del
      # cliente durante la compilación (ver ARG en el Dockerfile).
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      # Tamaño del pool, medido en el experimento E-15.
      #
      # Se probó con 5, 10 y 20 contra el escenario de pico: subir de 10 a 20
      # redujo el p(95) en un factor de 5,9 y el p(99) en 10,4, porque la cola
      # de admisión al pool pasó de 380 peticiones esperando a 4.
      #
      # Se deja en 20 aunque el plan gratuito de Render entregue 0,1 CPU: el
      # límite no estaba en la capacidad de la base sino en nuestra propia
      # configuración del pool.
      - key: PG_POOL_MAX
        value: "20"
      # Estrategia de concurrencia por defecto.
      - key: ESTRATEGIA_STOCK
        value: pesimista
