<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="680" height="400" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="600" fill="#1a1a1a">Ley de Amdahl: el techo de mejora cae al subir la contencion</text>
<text x="24" y="50" font-size="11" fill="#8a8a8a">A mayor fraccion serializada, menor es la mejora alcanzable por mas CPU.</text>
<line x1="70" y1="318.0" x2="630" y2="318.0" stroke="#e0e0e0" stroke-width="1"/>
<text x="62" y="322.0" font-size="10" fill="#8a8a8a" text-anchor="end">0</text>
<line x1="70" y1="270.0" x2="630" y2="270.0" stroke="#e0e0e0" stroke-width="1"/>
<text x="62" y="274.0" font-size="10" fill="#8a8a8a" text-anchor="end">5</text>
<line x1="70" y1="222.0" x2="630" y2="222.0" stroke="#e0e0e0" stroke-width="1"/>
<text x="62" y="226.0" font-size="10" fill="#8a8a8a" text-anchor="end">10</text>
<line x1="70" y1="174.0" x2="630" y2="174.0" stroke="#e0e0e0" stroke-width="1"/>
<text x="62" y="178.0" font-size="10" fill="#8a8a8a" text-anchor="end">14</text>
<line x1="70" y1="126.0" x2="630" y2="126.0" stroke="#e0e0e0" stroke-width="1"/>
<text x="62" y="130.0" font-size="10" fill="#8a8a8a" text-anchor="end">19</text>
<line x1="70" y1="78.0" x2="630" y2="78.0" stroke="#e0e0e0" stroke-width="1"/>
<text x="62" y="82.0" font-size="10" fill="#8a8a8a" text-anchor="end">24</text>
<text x="26" y="198" font-size="10" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 26 198)">Fraccion serializada (%)</text>
<text x="70.0" y="336" font-size="10" fill="#8a8a8a" text-anchor="middle">normal</text>
<text x="350.0" y="336" font-size="10" fill="#8a8a8a" text-anchor="middle">pesimista</text>
<text x="630.0" y="336" font-size="10" fill="#8a8a8a" text-anchor="middle">optimista</text>
<rect x="123.3" y="246.0" width="80" height="72.0" fill="#1e3a5f" rx="2"/>
<text x="163.3" y="224.0" font-size="13" font-weight="700" fill="#a33c2a" text-anchor="middle">techo 13.9x</text>
<text x="163.3" y="240.0" font-size="10" fill="#1a1a1a" text-anchor="middle">7.2% serializado</text>
<rect x="310.0" y="190.0" width="80" height="128.0" fill="#1e3a5f" rx="2"/>
<text x="350.0" y="168.0" font-size="13" font-weight="700" fill="#a33c2a" text-anchor="middle">techo 7.8x</text>
<text x="350.0" y="184.0" font-size="10" fill="#1a1a1a" text-anchor="middle">12.8% serializado</text>
<rect x="496.7" y="106.0" width="80" height="212.0" fill="#1e3a5f" rx="2"/>
<text x="536.7" y="84.0" font-size="13" font-weight="700" fill="#a33c2a" text-anchor="middle">techo 4.7x</text>
<text x="536.7" y="100.0" font-size="10" fill="#1a1a1a" text-anchor="middle">21.2% serializado</text>
<text x="350" y="360" font-size="10" fill="#8a8a8a" text-anchor="middle">escenario</text>
<text x="24" y="382" font-size="10" fill="#8a8a8a">A = 1 / [(1 - f) + f/k]   con k tendiendo a infinito:   A_max = 1 / fraccion serializada</text>
</svg>